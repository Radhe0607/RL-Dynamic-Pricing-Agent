name: Quality

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app.py src
      - name: Run short training smoke
        run: python -c "from src.config.dqn_config import DQNConfig; from src.training.train import train; train(DQNConfig(max_episodes=1, max_steps_per_episode=5, buffer_capacity=32, batch_size=1, min_buffer_size=1, checkpoint_dir='/tmp/pricing-smoke-checkpoints', save_every=1))"
